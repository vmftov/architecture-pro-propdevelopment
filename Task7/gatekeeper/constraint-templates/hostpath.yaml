apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
    name: k8srequirednohostpathvolumes
spec:
    crd:
        spec:
            names:
                kind: K8sRequiredNoHostPathVolumes
    targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
              package k8srequirednohostpathvolumes

              violation[{"msg": msg}] {
                volume := input.review.object.spec.volumes[_]
                volume.hostPath
                msg := sprintf("hostPath volume %v is not allowed", [volume.name])
              }

              violation[{"msg": msg}] {
                container := input_containers[_]
                not container.securityContext.readOnlyRootFilesystem == true
                msg := sprintf("Container %v must have readOnlyRootFilesystem setting", [container.name])
              }

              input_containers[c] {
                c := input.review.object.spec.containers[_]
              }

              input_containers[c] {
                c := input.review.object.spec.initContainers[_]
              }
